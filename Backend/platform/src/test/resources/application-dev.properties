# Tests use a fresh in-memory H2 so they never share IntelliJ's file database.
app.frontend.dev-server.enabled=false
spring.h2.console.enabled=false
spring.datasource.url=jdbc:h2:mem:sitedraw-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
