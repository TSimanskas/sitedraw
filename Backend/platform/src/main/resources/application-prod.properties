# Render / production: Postgres from env, no Vite, no H2 console
spring.h2.console.enabled=false
app.frontend.dev-server.enabled=false
app.storage.type=local
app.storage.local.base-path=/data/storage
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.gssEncMode=disable
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
