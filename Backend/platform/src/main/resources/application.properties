spring.application.name=platform
server.port=8080

# --- Active profile: "dev" = H2 + local (default), "docker" = PostgreSQL + MinIO ---
spring.profiles.active=dev

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JPA ---
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=validate

# --- JWT (set APP_JWT_SECRET in any non-local environment) ---
app.jwt.secret=${APP_JWT_SECRET:dev-only-change-me-use-at-least-32-characters-long}
app.jwt.expiration-ms=86400000

# --- PDF file storage ---
app.storage.type=local
app.storage.local.base-path=./storage

# --- Upload limits ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- CORS (React dev server) ---
app.cors.allowed-origins=http://localhost:5173

# Auto-start Vite from Spring Boot. Enabled in the dev profile.
app.frontend.dev-server.enabled=false
