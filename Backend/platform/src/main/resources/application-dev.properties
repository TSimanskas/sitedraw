# Local IntelliJ / mvn spring-boot:run. Render uses profile prod + Neon from env vars.
# Do not edit Flyway files that already ran (V1–V5). Add V6, V7, … instead.
# Checksum mismatch: stop the app and delete Backend/platform/data/platform-db*.db
spring.datasource.url=jdbc:h2:file:./data/platform-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/platform-db
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Start Vite together with Spring Boot (IntelliJ Run / mvn spring-boot:run)
app.frontend.dev-server.enabled=true
app.frontend.dev-server.directory=frontend
app.frontend.dev-server.port=5173
