# Docker Compose stack: PostgreSQL + MinIO
# Start infra:  docker compose up -d
# Run backend:  mvnw spring-boot:run -Dspring-boot.run.profiles=docker

spring.datasource.url=jdbc:postgresql://localhost:5432/platform
spring.datasource.username=platform
spring.datasource.password=platform
spring.datasource.driver-class-name=org.postgresql.Driver

spring.h2.console.enabled=false

app.storage.type=minio
app.storage.minio.endpoint=http://localhost:9000
app.storage.minio.access-key=minioadmin
app.storage.minio.secret-key=minioadmin
app.storage.minio.bucket=platform-documents
app.storage.minio.region=us-east-1
